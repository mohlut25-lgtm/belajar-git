    <style>
/* =========================
   PENGATURAN DASAR & DYNAMIC ANIMATED GRADIENT BACKGROUND
========================= */

*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    
    /* Gradasi Warna Dinamis Super Keren (Cyber Neon Dark Mode) */
    background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #0369a1, #0f172a);
    background-size: 400% 400%;
    animation: gradientAnimation 15s ease infinite;

    position: relative;
    overflow-x: hidden;
    color: #ffffff;
}

/* Animasi Perpindahan Warna Background */
@keyframes gradientAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}


/* =========================
   BACKGROUND ANIMASI SHAPES & CYBER GRID
========================= */

/* Efek Grid Cyber Tech halus di latar belakang */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
}

.bg-shapes{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

/* Shape Lingkaran Dasar */
.shape{
    position: absolute;
    border-radius: 50%;
    animation: melayang 18s infinite ease-in-out;
}

/* Gambar Foto Profil Melayang di Background */
.shape-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Lingkaran 1: Foto Profil bercahaya neon Cyan */
.shape:nth-child(1){
    width: 200px;
    height: 200px;
    top: 8%;
    left: 7%;
    overflow: hidden;
    border: 3px solid rgba(56, 189, 248, 0.6);
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.5), inset 0 0 15px rgba(56, 189, 248, 0.3);
}

/* Lingkaran 2: Glowing Purple Orb */
.shape:nth-child(2){
    width: 250px;
    height: 250px;
    bottom: 8%;
    right: 6%;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(147, 51, 234, 0.05) 70%, transparent 100%);
    border: 1px solid rgba(168, 85, 247, 0.3);
    box-shadow: 0 0 60px rgba(168, 85, 247, 0.4);
    animation-delay: -6s;
}

/* Lingkaran 3: Glowing Blue Orb */
.shape:nth-child(3){
    width: 160px;
    height: 160px;
    top: 65%;
    left: 15%;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, rgba(3, 105, 161, 0.05) 70%, transparent 100%);
    border: 1px solid rgba(14, 165, 233, 0.3);
    box-shadow: 0 0 50px rgba(14, 165, 233, 0.3);
    animation-delay: -12s;
}

/* Lingkaran 4: Small Accent Gold Orb */
.shape:nth-child(4){
    width: 100px;
    height: 100px;
    top: 15%;
    right: 20%;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(217, 119, 6, 0.05) 70%, transparent 100%);
    border: 1px solid rgba(245, 158, 11, 0.3);
    box-shadow: 0 0 35px rgba(245, 158, 11, 0.3);
    animation-delay: -3s;
}


/* Animasi melayang smooth */
@keyframes melayang{
    0%, 100%{
        transform: translateY(0) rotate(0deg) scale(1);
    }
    33%{
        transform: translateY(-25px) rotate(120deg) scale(1.05);
    }
    66%{
        transform: translateY(25px) rotate(240deg) scale(0.95);
    }
}


/* =========================
   BAGIAN HEADER
========================= */

.header{
    text-align: center;
    margin-bottom: 40px;
    animation: turun 0.8s ease;
}

/* Foto Profil Utama */
.profile-img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid rgba(56, 189, 248, 0.6);
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
    margin-bottom: 15px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.profile-img:hover {
    transform: scale(1.1) rotate(4deg);
    border-color: #38bdf8;
    box-shadow: 0 0 45px rgba(56, 189, 248, 0.7);
}

/* Judul */
.header h1{
    color: white;
    font-size: 2.3rem;
    font-weight: 700;
    margin: 0 0 10px;
    text-shadow: 0 4px 15px rgba(0,0,0,0.5);
    letter-spacing: 0.5px;
}

.header h1 i {
    color: #38bdf8;
    margin-right: 8px;
}

/* Deskripsi kecil */
.header p{
    color: rgba(255,255,255,0.85);
    font-size: 1.1rem;
    margin: 0;
    font-weight: 400;
}


/* =========================
   KOTAK UTAMA (GLASSMORPHISM)
========================= */

.content-border{
    position: relative;
    z-index: 10;

    background: rgba(15, 23, 42, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 28px;
    padding: 50px 40px;
    max-width: 650px;
    width: 92vw;

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                inset 0 0 30px rgba(255, 255, 255, 0.05);

    text-align: center;
    animation: naik 0.8s ease 0.2s both;
}


/* =========================
   MENU DROPDOWN INTERAKTIF
========================= */

.menu-container{
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Tombol menu */
.menu{
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    width: 450px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 25px;
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    position: relative;
}

/* Efek saat disentuh */
.menu:hover{
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(56, 189, 248, 0.5);
    box-shadow: 0 12px 35px rgba(56, 189, 248, 0.25);
}

/* Tulisan dalam menu */
.menu p{
    margin: 0 10px;
    display: flex;
    align-items: center;
    font-size: 1.25rem;
    font-weight: 600;
    color: white;
}

/* Animasi icon */
.menu i{
    transition: transform 0.4s;
    color: #38bdf8;
}

/* Ukuran icon */
.menu .fas{
    font-size: 1.2rem;
}

.menu .fab{
    font-size: 1.8rem;
    margin-right: 8px;
}

/* Memutar icon panah */
.menu.rotate i:last-child{
    transform: rotate(180deg);
}


/* =========================
   LIST SOSIAL MEDIA
========================= */

.social-lists{
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(25px);
    width: 450px;
    padding: 10px;
    list-style: none;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 15px 45px rgba(0,0,0,0.5);
    margin-top: 15px;
    max-height: 0;
    overflow: hidden;
    position: relative;
    z-index: 100;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* Saat menu terbuka */
.social-lists.show{
    max-height: 500px;
    opacity: 1;
}

/* Item list */
.social-lists li{
    display: flex;
    align-items: center;
    cursor: pointer;
    padding: 14px 20px;
    margin: 6px 4px;
    transition: all 0.3s ease;
    color: white;
    border-radius: 12px;
    position: relative;
}

/* Hover item */
.social-lists li:hover{
    background: rgba(255,255,255,0.15);
    transform: translateX(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

/* Icon list */
.social-lists li i{
    margin: 0 14px;
    font-size: 1.5rem;
    transition: transform 0.3s;
}

/* Icon membesar saat disentuh */
.social-lists li:hover i{
    transform: scale(1.2);
}

/* Tulisan sosial media */
.social-lists li span{
    font-size: 1.2rem;
    font-weight: 500;
}


/* =========================
   FOOTER
========================= */

.footer{
    margin-top: 35px;
    text-align: center;
    animation: fade 0.8s ease 0.6s both;
}

/* Tulisan footer */
.footer p{
    color: rgba(255,255,255,0.7);
    font-size: 0.95rem;
    margin: 0;
}

/* Link footer */
.footer a{
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s;
}

/* Efek hover link */
.footer a:hover{
    color: #7dd3fc;
    text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
}


/* =========================
   ANIMASI
========================= */

@keyframes fade{
    from{ opacity: 0; }
    to{ opacity: 1; }
}

@keyframes turun{
    from{
        opacity: 0;
        transform: translateY(-30px);
    }
    to{
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes naik{
    from{
        opacity: 0;
        transform: translateY(30px);
    }
    to{
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================
   RESPONSIVE HP & TABLET
========================= */

@media (max-width: 768px){
    body {
        padding: 20px 10px;
    }

    .content-border {
        padding: 35px 20px;
        width: 95vw;
    }

    .menu {
        width: 100%;
        max-width: 100%;
        padding: 16px 20px;
    }

    .menu p {
        font-size: 1.15rem;
    }

    .social-lists {
        width: 100%;
        max-width: 100%;
    }

    .social-lists li span {
        font-size: 1.1rem;
    }

    .header h1 {
        font-size: 1.8rem;
    }

    .profile-img {
        width: 110px;
        height: 110px;
    }

    /* Posisi & ukuran orb di layar HP */
    .shape:nth-child(1) {
        width: 130px;
        height: 130px;
        top: 2%;
        left: 2%;
    }

    .shape:nth-child(2) {
        width: 120px;
        height: 120px;
        bottom: 4%;
        right: 2%;
    }

    .shape:nth-child(3) {
        width: 90px;
        height: 90px;
    }

    .shape:nth-child(4) {
        width: 70px;
        height: 70px;
    }
}

@media (max-width: 480px){
    .content-border {
        padding: 30px 16px;
    }

    .header h1 {
        font-size: 1.4rem;
    }

    .header p {
        font-size: 0.95rem;
    }

    .profile-img {
        width: 95px;
        height: 95px;
    }

    .menu p {
        font-size: 1rem;
    }

    .social-lists li {
        padding: 12px 14px;
    }

    .social-lists li span {
        font-size: 1rem;
    }

    .social-lists li i {
        font-size: 1.2rem;
        margin: 0 8px;
    }
}

    <!-- ============================================================
         JAVASCRIPT DI DALAM FILE HTML (INTERNAL SCRIPT)
         ============================================================ -->
    <script>
/* =========================
   MENGAMBIL ELEMEN HTML
========================= */

/* Tombol menu */
const menu = document.querySelector('.menu');

/* Tulisan di dalam menu */
const teksMenu = menu.querySelector('p');

/* List sosial media */
const daftarSosial = document.querySelector('.social-lists');


/* =========================
   SAAT MENU DIKLIK
========================= */

menu.onclick = e => {

    /* Agar klik tidak keluar */
    e.stopPropagation();

    /* Menampilkan list */
    daftarSosial.classList.toggle('show');

    /* Memutar icon panah */
    menu.classList.toggle('rotate');
};


/* =========================
   SAAT ITEM SOSIAL DIKLIK
========================= */

daftarSosial.onclick = e => {

    e.stopPropagation();

    /* Mengambil item LI terdekat */
    const li = e.target.closest('li');

    /* Jika tidak ada item */
    if(!li) return;

    /* Mengambil link URL */
    const url = li.dataset.url;

    /* Mengambil icon */
    const icon = li.querySelector('i');

    /* Mengubah isi menu sesuai pilihan */
    teksMenu.innerHTML = `
        <i class="${icon.className}"
           style="
           color:${icon.style.color};
           font-size:1.5rem;
           margin-right:8px;">
        </i>

        <span>
            ${li.querySelector('span').textContent}
        </span>
    `;

    /* Menutup list */
    daftarSosial.classList.remove('show');

    /* Mengembalikan icon panah */
    menu.classList.remove('rotate');

    /* Membuka link */
    setTimeout(() => {
        window.open(url, '_blank');
    }, 200);
};


/* =========================
   MENUTUP MENU SAAT KLIK LUAR
========================= */

document.onclick = () => {

    daftarSosial.classList.remove('show');

    menu.classList.remove('rotate');
};


/* =========================
   MENUTUP MENU DENGAN ESC
========================= */

document.onkeydown = e => {

    if(e.key === 'Escape'){

        daftarSosial.classList.remove('show');

        menu.classList.remove('rotate');
    }
};
    </script>

</body>
